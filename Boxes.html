<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>Boxes Page</title>
<style>
div {
    background:rgb(181, 200, 189);
    width: 200px;
    height: 200px;
    border: 2px solid #0d292f;
    padding:20px;
    margin: 20px;
    border-radius: 10px;
    box-shadow: 10px 10px 5px #9fafbd;
}

#two {
    background:#8c967b;
    width: 250px;
    height: 250px;
    border: 4px dashed #e0dab7;
    box-shadow: 15px 15px 0px #19281f;
    border-radius: 40px;
    margin: 30px;
}

#three {
    background:bisque;
    width: 210px;
    height: 210px;
    border-radius: 20px;
    border: 5px solid #362d22;
    box-shadow: 10px 10px 0px #58442c;
}

#four {
    background:darkslategray;
    width: 130px;
    height: 130px;
    border-radius: 20px;
    border: 5px solid #362d22;
    box-shadow: 10px 10px 0px #58442c;
}

#five {
    background:bisque;
    width: 50px;
    height: 50px;
    border-radius: 20px;
    border: 5px solid #362d22;
    box-shadow: 10px 10px 0px #58442c;
}

a {
    color:#132d32;

}
</style>
</head>
            
<body>

<h1>Boxes</h1>

<div id="one">
<p>Hello.</p>
</div>
<div id="two">
    <p>Box.</p>
</div>
<div id="three">
    <div id="four">
    <div id="five"></div>
    </div>
</div>

</body>

</html>
