<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>Transistions Page</title>
<style>
Body {
    background:rgb(143, 249, 73)
}
   #one {
    width: 100px;
    height:100px;
    background:darkslategray;
    background-image:url("raccoon-silly-raccoon.gif");
    background-size: cover;
    background-position: center center;
    margin: 80px;
    transition:background 1s, transform 1s;
    margin-left: auto;
    margin-right: auto;
   }
   #one:hover {
    background:darkseagreen;
    background-image:url("raccoon-silly-raccoon.gif");
    background-size: cover;
    background-position: center center;
    width: 500px;
    height: 500px;
    transform: rotate(20000deg)scaleX(2);
    border-radius:30px
   }

#two {
    background:blue;
    background-image: url("raccoon.jpeg");
    background-size: cover;
    background-position: center center;
    width:350px;
    height:350px;
    margin:80px;
    transition:background 0.002s, transform 0.002s;
    margin-left: auto;
    margin-right: auto;
}
#two:hover {
    background:dodgerblue;
    transform: translate(300px, 250px);
}

#three {
    background-image: url("possum1.jpg.avif");
    background-size: cover;
    background-position: center center;
    width:350px;
    height:350px;
    margin:80px;
    transition:background 0.002s,transform 2s;
    margin-left: auto;
    margin-right: auto;
}
#three:hover {
    transform: rotateX(150deg);
}

#four {
    width: 400px;
    height:400px;
    background:darkslategray;
    background-image:url("SillyRaccoon2.png");
    background-size: cover;
    background-position: center center;
    margin: 80px;
    transition:background 0.1s, transform 20s; 
    margin-left: auto;
    margin-right: auto;
}
#four:hover {
    transform: rotate(200000deg)scaleX(5);
    }

#five{
    background:rgb(47, 113, 255);
    width:400px;
    height:300px;
    background-image:url("possum3.jpeg");
    background-size: cover;
    background-position: center center;
    margin: 80px;
    transition:background 1s, transform 1s;
    margin-left: auto;
    margin-right: auto;

}

#five:hover {
    background:darkseagreen;
    background-image:url("possum3.jpeg");
    background-size: cover;
    background-position: center center;
    width: 500px;
    height: 500px;
    transform: rotate(20000deg)scaleX(2);
    border-radius:30px
}

h1 {
    text-align:center
}
